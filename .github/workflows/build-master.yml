name: Build master

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_source:
    name: "Run code checks"
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build disruptoor"
    needs: [check_source]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_shared-build.yaml
    with:
      release: "snapshot"
      docker: true
      docker_repository: "ghcr.io/ethpandaops/disruptoor"
      docker_tag_prefix: "master"
      additional_tags: '["master","master-latest"]'
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}
