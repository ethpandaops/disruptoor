name: Build dev image

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag prefix"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_info:
    name: "Validate build inputs"
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.loadinfo.outputs.tag }}
    steps:
    - name: "Resolve build inputs"
      id: loadinfo
      shell: bash
      env:
        INPUT_DOCKER_TAG: ${{ inputs.docker_tag }}
      run: |
        set -euo pipefail

        tag="$INPUT_DOCKER_TAG"

        if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,120}$ ]]; then
          echo "::error::Docker tag must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,120}, got '$tag'."
          exit 1
        fi

        if [[ "$tag" == "latest" || "$tag" == "master" || "$tag" == "master-latest" || "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Refusing to publish reserved release/master Docker tag '$tag' from the dev image workflow."
          exit 1
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"

  check_source:
    name: "Run code checks"
    needs: [build_info]
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build disruptoor"
    needs: [build_info, check_source]
    uses: ./.github/workflows/_shared-build.yaml
    with:
      release: "snapshot"
      docker: true
      docker_repository: "ethpandaops/disruptoor"
      docker_tag_prefix: ${{ needs.build_info.outputs.docker_tag }}
      additional_tags: '["${{ needs.build_info.outputs.docker_tag }}","${{ needs.build_info.outputs.docker_tag }}-latest"]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
