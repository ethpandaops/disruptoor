name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number ('1.2.3' or 'v1.2.3')"
        required: true

permissions:
  contents: read

jobs:
  release_info:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
    - name: Resolve release metadata
      id: release
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        GIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "release" ]; then
          tag="$RELEASE_TAG"
          ref="$tag"

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "::error::Release Docker publishing only supports stable releases."
            exit 1
          fi
        else
          version="${INPUT_VERSION#v}"
          tag="v$version"
          ref="$GIT_SHA"
        fi

        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag must match vX.Y.Z, got '$tag'."
          exit 1
        fi

        version="${tag#v}"

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

  check_source:
    name: "Run code checks"
    needs: [release_info]
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build disruptoor"
    needs: [release_info, check_source]
    uses: ./.github/workflows/_shared-build.yaml
    with:
      release: ${{ needs.release_info.outputs.tag }}
      docker: true
      docker_repository: "ethpandaops/disruptoor"
      docker_tag_prefix: ${{ needs.release_info.outputs.tag }}
      additional_tags: '["${{ needs.release_info.outputs.tag }}","latest"]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish_release_assets:
    name: Publish Release Assets
    needs: [release_info, build_binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ needs.release_info.outputs.ref }}

    - name: "Generate release changelog"
      id: changelog
      shell: bash
      env:
        TAG: ${{ needs.release_info.outputs.tag }}
      run: |
        set -euo pipefail

        git fetch --tags --force

        if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          prev_tag=$(git tag --sort=-version:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | awk -v current="$TAG" '$0 == current { found = 1; next } found { print; exit }' || true)
        else
          prev_tag=$(git tag --sort=-version:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)
        fi

        echo "previous release: $prev_tag"

        if [ "$prev_tag" ]; then
          changelog=$(git log --oneline --no-decorate "$prev_tag..HEAD")
        else
          changelog=$(git log --oneline --no-decorate)
        fi

        if [ -z "$changelog" ]; then
          changelog="No changes detected since $prev_tag."
        fi

        {
          echo "changelog<<EOF"
          printf '%s\n' "$changelog" | sed 's/^/ - /'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: "Download build artifacts"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

    - name: "Generate release package: disruptoor_${{ needs.release_info.outputs.version }}_linux_amd64.tar.gz"
      run: |
        cd disruptoor_linux_amd64
        tar -czf ../disruptoor_${{ needs.release_info.outputs.version }}_linux_amd64.tar.gz .

    - name: "Generate release package: disruptoor_${{ needs.release_info.outputs.version }}_linux_arm64.tar.gz"
      run: |
        cd disruptoor_linux_arm64
        tar -czf ../disruptoor_${{ needs.release_info.outputs.version }}_linux_arm64.tar.gz .

    - name: Create draft release
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        draft: true
        prerelease: false
        name: ${{ needs.release_info.outputs.tag }}
        tag_name: ${{ needs.release_info.outputs.tag }}
        body: |
          ### Changes
          ${{ steps.changelog.outputs.changelog }}

          ### Release Artifacts
          | Release File  | Description |
          | ------------- | ------------- |
          | [disruptoor_${{ needs.release_info.outputs.version }}_linux_amd64.tar.gz](https://github.com/ethpandaops/disruptoor/releases/download/${{ needs.release_info.outputs.tag }}/disruptoor_${{ needs.release_info.outputs.version }}_linux_amd64.tar.gz) | disruptoor binary for linux/amd64 |
          | [disruptoor_${{ needs.release_info.outputs.version }}_linux_arm64.tar.gz](https://github.com/ethpandaops/disruptoor/releases/download/${{ needs.release_info.outputs.tag }}/disruptoor_${{ needs.release_info.outputs.version }}_linux_arm64.tar.gz) | disruptoor binary for linux/arm64 |

          The release is also available as a Docker image: `ethpandaops/disruptoor:${{ needs.release_info.outputs.tag }}`.
        files: |
          disruptoor_${{ needs.release_info.outputs.version }}_linux_amd64.tar.gz
          disruptoor_${{ needs.release_info.outputs.version }}_linux_arm64.tar.gz

    - name: Upload assets to published release
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.release_info.outputs.tag }}
        VERSION: ${{ needs.release_info.outputs.version }}
      run: |
        gh release upload "$TAG" \
          "disruptoor_${VERSION}_linux_amd64.tar.gz" \
          "disruptoor_${VERSION}_linux_arm64.tar.gz" \
          --clobber
