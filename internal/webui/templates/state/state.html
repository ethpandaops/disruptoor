{{ define "page" }}
  <div class="container mt-2">
    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
      <h2 class="mb-0">State</h2>
      <div>
        <button class="btn btn-danger btn-sm" data-action="clear-all">
          <i class="fas fa-trash me-1"></i> Clear all
        </button>
        <button id="state-apply-btn" class="btn btn-primary btn-sm">
          <i class="fas fa-upload me-1"></i> Apply
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <p class="text-muted small mb-2">
          Edit the JSON below and click <strong>Apply</strong> to <code>PUT /v1/state</code>.
          Wire format is identical to the
          <a href="https://github.com/ethpandaops/disruptoor" target="_blank" rel="noopener">v1 API</a>.
        </p>
        <textarea id="state-editor" class="form-control font-monospace" rows="24">{{ .StateJSON }}</textarea>
      </div>
    </div>
  </div>
{{ end }}
